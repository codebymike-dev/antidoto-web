name: Vista previa

# Vercel: cada push ya tiene su vista previa por la integración de Git. El job "vercel" solo corre
# a mano o cuando el panel publica contenido en vista previa (workflow_dispatch): vuelve a
# construir main sin un commit. Necesita VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID
# (ver deploy.yml). Sin esos secrets se omite con un aviso, para no dejar el CI en rojo.

on:
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        run: echo "::warning::Faltan VERCEL_TOKEN, VERCEL_ORG_ID o VERCEL_PROJECT_ID; no se publica la vista previa en Vercel."
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: actions/checkout@v4
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: npm ci
      - if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npx --yes vercel@59 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@59 build --token="$VERCEL_TOKEN"
          url=$(npx --yes vercel@59 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Vista previa en Vercel: ${url}" >> "$GITHUB_STEP_SUMMARY"
